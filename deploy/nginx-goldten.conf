# Nginx site config.  Copy to /etc/nginx/sites-available/goldten and link it into
# sites-enabled.  Replace yourdomain.com.  Certbot later adds the HTTPS (443) part.
server {
    listen 80;
    server_name yourdomain.com;

    # login prompt for everything (create the file with: sudo htpasswd -c /etc/nginx/.htpasswd keerthesh)
    auth_basic "Gold Ten Paper Desk";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Tier 1: the dashboard's static files, served directly by Nginx
    root /home/ubuntu/goldten-paper-bot/web;
    index index.html;

    # Tier 2: anything under /api/ goes to FastAPI inside the server
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # live log stream: keep the connection open and don't buffer it
    location /api/logs/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
